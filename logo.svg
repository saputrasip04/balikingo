<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="40%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Camera Body Gradient -->
    <linearGradient id="camBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Clapper / Top Bar Gradient -->
    <linearGradient id="clapperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Return Loop Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Core Lens Glow Gradient -->
    <radialGradient id="lensCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Glass Reflection Highlights -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowDark" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f0e1a" flood-opacity="0.45"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow Ring -->
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
  
  <!-- Top Glass Sheen -->
  <path d="M12 116 C12 56, 56 12, 116 12 L396 12 C456 12, 500 56, 500 116 C500 130, 480 180, 420 220 C320 280, 160 220, 12 180 Z" fill="url(#glassShine)"/>

  <!-- MAIN EMBLEM (Cinema Camera + Clapper + Circulation Arrow) -->
  <g filter="url(#shadowDark)" transform="translate(0, 4)">

    <!-- Top Handle / Viewfinder Broadcast Rig -->
    <path d="M180 134 L310 134 C322 134, 332 144, 332 156 L332 172 L158 172 L158 156 C158 144, 168 134, 180 134 Z" fill="#2d2b55"/>
    <path d="M214 112 L284 112 C292 112, 298 118, 298 126 L298 134 L200 134 L200 126 C200 118, 206 112, 214 112 Z" fill="#4338ca"/>
    <!-- Viewfinder Screen / Mic Mount -->
    <rect x="336" y="144" width="34" height="24" rx="6" fill="#10b981" opacity="0.9"/>

    <!-- Clapperboard Stripes on Camera Upper Crest -->
    <g transform="translate(144, 172)">
      <rect x="0" y="0" width="224" height="26" rx="6" fill="#1e1b4b"/>
      <path d="M20 0 L40 0 L24 26 L4 26 Z" fill="#ffffff" opacity="0.85"/>
      <path d="M68 0 L88 0 L72 26 L52 26 Z" fill="#38bdf8"/>
      <path d="M116 0 L136 0 L120 26 L100 26 Z" fill="#ffffff" opacity="0.85"/>
      <path d="M164 0 L184 0 L168 26 L148 26 Z" fill="#34d399"/>
    </g>

    <!-- Main Camera Chassis -->
    <rect x="136" y="196" width="240" height="196" rx="36" fill="url(#camBodyGrad)" stroke="#4338ca" stroke-width="4"/>

    <!-- Recording Indicator Tally Light (Red Glow) -->
    <circle cx="172" cy="232" r="7" fill="#ef4444"/>
    <circle cx="172" cy="232" r="3.5" fill="#fecaca"/>

    <!-- Battery / Media Card Slot Accent -->
    <rect x="162" y="348" width="46" height="8" rx="4" fill="#312e81"/>

    <!-- Right Side Cinema Accessories (Lens Mount Bracket & Port) -->
    <rect x="370" y="244" width="16" height="96" rx="6" fill="#3730a3"/>
    <circle cx="378" cy="268" r="3" fill="#38bdf8"/>
    <circle cx="378" cy="292" r="3" fill="#10b981"/>
    <circle cx="378" cy="316" r="3" fill="#f59e0b"/>

    <!-- OUTER LENS BARREL -->
    <circle cx="270" cy="294" r="86" fill="#0f172a" stroke="#4f46e5" stroke-width="5"/>
    <circle cx="270" cy="294" r="76" fill="#1e1b4b"/>

    <!-- DYNAMIC CIRCULAR RETURN ARROW ("BALIKIN" / SIRKULASI SIKLUS PINJAM) -->
    <!-- Orbit Track Background -->
    <circle cx="270" cy="294" r="62" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
    
    <!-- Glowing Orbit Return Arc -->
    <path d="M 270 232 A 62 62 0 1 1 209 308" fill="none" stroke="url(#orbitGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glowCyan)"/>

    <!-- Arrowhead at End of Return Loop pointing clockwise (Ready / "Go" & Returned / "Balikin") -->
    <path d="M 205 316 L 194 290 L 226 298 Z" fill="#34d399" filter="url(#glowCyan)"/>

    <!-- INNER OPTICAL GLASS LENS -->
    <circle cx="270" cy="294" r="46" fill="url(#lensCore)"/>
    <circle cx="270" cy="294" r="44" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>

    <!-- Lens Aperture Iris Blades (Subtle Geometry) -->
    <circle cx="270" cy="294" r="28" fill="#0b1120" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Center PLAYHEAD / "GO" FORWARD ICON (Cinematic White/Cyan) -->
    <polygon points="264,281 282,294 264,307" fill="#ffffff" opacity="0.95"/>

    <!-- Lens Optical Flare Reflection -->
    <path d="M 242 272 A 38 38 0 0 1 278 258" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <circle cx="286" cy="318" r="3" fill="#38bdf8" opacity="0.8"/>
  </g>
</svg>
